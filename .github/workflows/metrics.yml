name: Pro Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 05-guruprakash
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # Design & Colors (Purple/Cyan Theme)
          config_order: base.header, isocalendar, languages, habits, activity
          # Colors match your GURU Bot Builder
          base_colors: "8b5cf6, 06b6d4, 10b981, f59e0b" 

          # 3D Contribution Calendar (Animated/High-End)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Detailed Languages (Better UI)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8

          # Typing & Coding Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Real-time Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: all

          filename: generated/pro-metrics.svg
