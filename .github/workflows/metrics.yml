name: Animated Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 05-guruprakash
          template: classic
          base: header, metadata
          config_animations: yes # <--- This enables the arrival animation
          
          # This plugin adds the "Lines of Code Changed" section from your image
          plugin_followup: yes
          plugin_followup_sections: user
          
          filename: generated/overview.svg

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 05-guruprakash
          template: classic
          base: ""
          config_animations: yes # <--- Animates the language bars
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          filename: generated/languages.svg
