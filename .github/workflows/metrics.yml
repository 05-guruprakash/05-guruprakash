name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: jstrieb/github-stats@master
        with:
          ACCESS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_ACTOR: 05-guruprakash
          EXCLUDED: ""
          EXCLUDED_LANGS: ""
          COUNT_STATS_PRIVATE: true
          SHOW_PROGRESS: true
