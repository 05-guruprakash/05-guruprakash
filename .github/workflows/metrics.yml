name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] 
  workflow_dispatch: 
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 05-guruprakash
          template: classic
          base: header, community, repositories, metadata
          filename: generated/overview.svg
          
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 05-guruprakash
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          filename: generated/languages.svg
